name: Deploy docs

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  require-ci:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: Require CI success
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "CI finished with ${{ github.event.workflow_run.conclusion }} on ${{ github.event.workflow_run.head_sha }}"
            exit 1
          fi

  deploy:
    needs: [ci, require-ci]
    if: |
      always() &&
      (needs.ci.result == 'success' || needs.require-ci.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - name: Deploy to Cloudflare Workers
        if: env.HAS_CLOUDFLARE_TOKEN == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push')
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: npm
      - name: Skip deploy without Cloudflare secrets
        if: env.HAS_CLOUDFLARE_TOKEN != 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push')
        run: |
          echo "Set GitHub secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to deploy."
          echo "Token needs Edit Cloudflare Workers. Do not also enable Workers Builds on this repo."
