name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Example apply + typecheck
        run: |
          npm run build
          npm ci --prefix examples/api
          npm run apply-to-example
          npm run typecheck --prefix examples/api
