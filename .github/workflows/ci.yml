name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build -w docs
      - run: npm run sync-registry
      - run: npm test -w adonia
      - name: Fixture typecheck
        run: npm run typecheck -w adonis-api-stater
